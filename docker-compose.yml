version: "3.8"

services:
  backend:
    build: .
    container_name: trustsupport-backend
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
      - ./src:/app/src

  frontend:
    build: .
    container_name: trustsupport-frontend
    command: streamlit run src/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000/chat
      - HEALTH_URL=http://backend:8000/health
    volumes:
      - ./src:/app/src
